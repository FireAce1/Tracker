
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Productivity Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow">

<h1 class="text-3xl font-bold text-center mb-4">
🚀 AI Developer Routine Tracker
</h1>

<p class="text-center text-gray-500 mb-6">
Track habits, maintain streaks and generate AI study plans
</p>

<!-- STREAK -->

<div class="text-center mb-6">

🔥 Current Streak:
<span id="streak" class="text-green-600 font-bold text-xl">0</span> days

</div>

<!-- DAILY TASKS -->

<h2 class="font-semibold mb-3">Daily Tasks</h2>

<ul id="tasks" class="grid grid-cols-2 gap-2 mb-6">

<li><label><input type="checkbox" class="task mr-2">DSA Practice</label></li>
<li><label><input type="checkbox" class="task mr-2">Java Revision</label></li>
<li><label><input type="checkbox" class="task mr-2">Spring Boot</label></li>
<li><label><input type="checkbox" class="task mr-2">AWS Learning</label></li>
<li><label><input type="checkbox" class="task mr-2">System Design</label></li>
<li><label><input type="checkbox" class="task mr-2">Terraform / Ansible</label></li>
<li><label><input type="checkbox" class="task mr-2">Video Editing</label></li>
<li><label><input type="checkbox" class="task mr-2">Gym Workout</label></li>

</ul>

<button onclick="completeDay()"
class="bg-green-600 text-white px-4 py-2 rounded mb-8">
Mark Day Complete
</button>

<!-- AI ROUTINE PLANNER -->

<h2 class="text-xl font-semibold mb-4">
🧠 AI Routine Planner
</h2>

<div class="grid md:grid-cols-3 gap-3 mb-4">

<input id="hours"
type="number"
placeholder="Available hours"
class="border p-2 rounded">

<select id="focus"
class="border p-2 rounded">

<option value="coding">Coding</option>
<option value="cloud">Cloud</option>
<option value="devops">DevOps</option>
<option value="content">Content Creation</option>

</select>

<select id="energy"
class="border p-2 rounded">

<option value="high">High Energy</option>
<option value="medium">Medium Energy</option>
<option value="low">Low Energy</option>

</select>

</div>

<button onclick="generatePlan()"
class="bg-blue-600 text-white px-4 py-2 rounded">
Generate AI Plan
</button>

<div id="plan"
class="mt-6 p-4 bg-gray-50 rounded"></div>

<!-- HEATMAP -->

<h2 class="mt-8 font-semibold mb-2">
🔥 Contribution Graph
</h2>

<div id="heatmap" class="grid grid-cols-30 gap-1"></div>

</div>

<script>

function getToday(){
return new Date().toISOString().slice(0,10)
}

function completeDay(){

let data=JSON.parse(localStorage.getItem("heatmap")||"{}")

let today=getToday()

data[today]=1

localStorage.setItem("heatmap",JSON.stringify(data))

updateStreak()
loadHeatmap()

}

function updateStreak(){

let data=JSON.parse(localStorage.getItem("heatmap")||"{}")

let streak=0

for(let i=0;i<365;i++){

let d=new Date()
d.setDate(d.getDate()-i)

let key=d.toISOString().slice(0,10)

if(data[key]){
streak++
}else{
break
}

}

document.getElementById("streak").innerText=streak

}

function loadHeatmap(){

let data=JSON.parse(localStorage.getItem("heatmap")||"{}")

let map=document.getElementById("heatmap")

map.innerHTML=""

for(let i=0;i<365;i++){

let d=new Date()
d.setDate(d.getDate()-i)

let key=d.toISOString().slice(0,10)

let val=data[key]

let color="bg-gray-200"

if(val) color="bg-green-600"

let cell=document.createElement("div")

cell.className="w-3 h-3 rounded "+color

map.appendChild(cell)

}

}

updateStreak()
loadHeatmap()

/* AI ROUTINE PLANNER */

function generatePlan(){

let hours=document.getElementById("hours").value
let focus=document.getElementById("focus").value
let energy=document.getElementById("energy").value

let plan=""

if(focus==="coding"){

plan=`
Morning
• DSA Practice (45m)

Afternoon
• Java Interview Questions (45m)

Evening
• System Design (30m)
`

}

if(focus==="cloud"){

plan=`
Morning
• AWS Services (1h)

Afternoon
• Terraform Practice (30m)

Evening
• Architecture Study (30m)
`

}

if(focus==="devops"){

plan=`
Morning
• Terraform Labs (45m)

Afternoon
• Ansible Automation (45m)

Evening
• CI/CD Concepts (30m)
`

}

if(focus==="content"){

plan=`
Morning
• Script Writing (30m)

Afternoon
• Video Editing (1h)

Evening
• Social Media Posting (30m)
`

}

document.getElementById("plan").innerText=plan

}

</script>

</body>

</html>
